name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # kbb (JVM-free) runs this repository's .cljk tests; `clojure -M:test`
    # found none of them and reported "Ran 0 tests" as success
    # (root ADR-2610100200). A run of zero tests fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kotoba-lang/kotoba/.github/actions/setup-kbb@485a8e9716a330e616ccb5bc9fa5d45104326382
      - name: kbb -M:test
        run: |
          set -o pipefail
          kbb -M:test 2>&1 | tee kbb-test.log
          grep -E '^kbb test: [1-9][0-9]* test\(s\), [0-9]+ pass, 0 fail, 0 error' kbb-test.log


  test-cljs:
    name: shadow-cljs node-test (real ClojureScript, not just .cljc-named)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.gitlibs
            ~/.m2
          key: ${{ runner.os }}-cljs-${{ hashFiles('package.json', 'deps.edn') }}

      - run: npm install
      # gen-shadow-cljs-edn.bb resolves `clojure -Spath` (the SAME git/sha
      # deps.edn dependencies `clojure -M:test` uses) into shadow-cljs.edn's
      # :source-paths, so this always tests against the exact pinned
      # versions -- never a hand-duplicated, driftable path list.
      - run: npm run test:cljs
